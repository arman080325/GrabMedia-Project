<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" role="img" aria-label="GrabMedia animated banner" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3d00"/>
      <stop offset="1" stop-color="#ffb300"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#ff3d00" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ff3d00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".05"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="24"/></clipPath>
    <style>
      .title{font:900 118px 'Arial Black',Impact,'Helvetica Neue',sans-serif;letter-spacing:10px;text-anchor:middle}
      .sub{font:600 20px 'Courier New',monospace;letter-spacing:6px;text-anchor:middle;fill:#9a9aa5}
      .lbl{font:700 13px 'Courier New',monospace;letter-spacing:3px;text-anchor:middle;fill:#d8d8e0}
      .glow{animation:pulse 4s ease-in-out infinite;transform-origin:600px 150px}
      .scan{animation:sweep 5s linear infinite}
      .gr{animation:glitchR 3.2s steps(1) infinite}
      .gc{animation:glitchC 3.2s steps(1) infinite}
      .flow{stroke-dasharray:8 10;animation:dash 1.2s linear infinite}
      .node{animation:blink 3s ease-in-out infinite}
      .n2{animation-delay:.5s}.n3{animation-delay:1s}.n4{animation-delay:1.5s}
      @keyframes pulse{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.1);opacity:1}}
      @keyframes sweep{from{transform:translateX(-400px)}to{transform:translateX(1600px)}}
      @keyframes dash{to{stroke-dashoffset:-18}}
      @keyframes blink{0%,100%{opacity:.45}50%{opacity:1}}
      @keyframes glitchR{0%,86%,100%{transform:translate(0,0);opacity:0}88%{transform:translate(-7px,2px);opacity:.8}92%{transform:translate(5px,-2px);opacity:.8}96%{transform:translate(-3px,0);opacity:.8}}
      @keyframes glitchC{0%,86%,100%{transform:translate(0,0);opacity:0}90%{transform:translate(7px,-2px);opacity:.8}94%{transform:translate(-5px,2px);opacity:.8}98%{transform:translate(3px,0);opacity:.8}}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="#0a0a0f"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <ellipse class="glow" cx="600" cy="150" rx="520" ry="150" fill="url(#glow)"/>
    <rect class="scan" x="0" y="0" width="400" height="340" fill="url(#scan)" transform="skewX(-20)"/>

    <!-- title with glitch layers -->
    <text class="title gr" x="600" y="165" fill="#ff1744">GRABMEDIA</text>
    <text class="title gc" x="600" y="165" fill="#00e5ff">GRABMEDIA</text>
    <text class="title" x="600" y="165" fill="url(#fire)">GRABMEDIA</text>
    <text class="sub" x="600" y="212">INSTAGRAM  +  YOUTUBE  //  ONE CLEAN WORKFLOW</text>

    <!-- pipeline -->
    <line class="flow" x1="260" y1="278" x2="940" y2="278" stroke="#ff3d00" stroke-width="2" stroke-opacity=".7"/>
    <g>
      <circle class="node" cx="260" cy="278" r="9" fill="#ff3d00"/>
      <circle class="node n2" cx="487" cy="278" r="9" fill="#ff6d00"/>
      <circle class="node n3" cx="713" cy="278" r="9" fill="#ff9100"/>
      <circle class="node n4" cx="940" cy="278" r="9" fill="#00e676"/>
    </g>
    <text class="lbl" x="260" y="313">PASTE</text>
    <text class="lbl" x="487" y="313">PREVIEW</text>
    <text class="lbl" x="713" y="313">CHOOSE</text>
    <text class="lbl" x="940" y="313">DOWNLOAD</text>
    <circle r="5" fill="#fff">
      <animateMotion dur="3.6s" repeatCount="indefinite" path="M260,278 L940,278"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="3.6s" repeatCount="indefinite"/>
    </circle>

    <rect x="1" y="1" width="1198" height="338" rx="23" fill="none" stroke="url(#fire)" stroke-opacity=".5" stroke-width="2"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
