<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 8" width="100%" preserveAspectRatio="none" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#ff3d00" stop-opacity="0"/>
      <stop offset=".3" stop-color="#ff3d00"/>
      <stop offset=".7" stop-color="#ffb300"/>
      <stop offset="1" stop-color="#ffb300" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="s" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <style>.sh{animation:m 3s ease-in-out infinite}@keyframes m{from{transform:translateX(-300px)}to{transform:translateX(1200px)}}</style>
    <clipPath id="c"><rect y="2" width="1200" height="4" rx="2"/></clipPath>
  </defs>
  <rect y="2" width="1200" height="4" rx="2" fill="url(#g)"/>
  <g clip-path="url(#c)"><rect class="sh" y="0" width="300" height="8" fill="url(#s)"/></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
